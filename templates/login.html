<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>登录 - Rsync Mirror</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        background-color: #f5f5f5;
      }

      .login-container {
        flex: 1 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }

      .brand-logo {
        text-align: center;
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 20px;
        color: #2196f3;
      }

      .card-title {
        text-align: center;
        margin-bottom: 30px;
      }

      .btn {
        width: 100%;
        margin-top: 20px;
      }

      .error-message {
        text-align: center;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="card login-card">
        <div class="card-content">
          <div class="brand-logo">Rsync Mirror</div>
          <span class="card-title">用户登录</span>

          {{if .Error}}
          <div class="red-text error-message">
            <i class="material-icons">error</i> 用户名或密码错误，请重试
          </div>
          {{end}}

          <form method="post" action="/login">
            <div class="input-field">
              <i class="material-icons prefix">person</i>
              <input id="user" name="user" type="text" required />
              <label for="user">用户名</label>
            </div>

            <div class="input-field">
              <i class="material-icons prefix">lock</i>
              <input id="pass" name="pass" type="password" required />
              <label for="pass">密码</label>
            </div>

            <button class="btn waves-effect waves-light" type="submit">
              <i class="material-icons right">send</i>登录
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  </body>
</html>
